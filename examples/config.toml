# Copy this file to:
#   $XDG_CONFIG_HOME/merry/config.toml
# or, when XDG_CONFIG_HOME is unset:
#   ~/.config/merry/config.toml
#
# Usually required edits:
# - Set [providers.default].model for your provider.
# - Set [providers.openai-compatible].base_url for non-OpenAI-compatible hosts.
# - Set protocol = "chat_completions" for vendors that expose Chat Completions
#   instead of the OpenAI Responses API.
# - Set exactly one credential source in [providers.openai-compatible]:
#     api_key = "sk-..."
#   or:
#     api_key_file = "secrets/openai.key"
#
# Keep credentials out of this file when committing changes.
# Provider profiles created in the TUI are stored separately in
# $XDG_CONFIG_HOME/merry/managed/providers.toml. This tracked example remains
# the contract for user-authored config.toml.

[global]
profile = "default"

[cli]
# sandbox = "workspace" or "off". Omitted means workspace: each action runs in
# the workspace sandbox. "off" runs actions on the host. --sandbox on the
# command line replaces this.
# The first time workspace mode opens a directory, a dialog asks you to trust
# it, then offers read-write, read-only, whether to save that choice, and exit.
# Read-write loads AGENTS.md. Read-only does not.
# A saved choice lives in $XDG_STATE_HOME/merry/workspace-trust.json.
# --trust-workspace yes or no sets it without a prompt. --sandbox off does not ask.
# Who reviews permission requests:
#   "auto"             the [models.approval_review] model decides first
#   "ask"              you decide
#   "always-approve"   no review round
#   "deny"             refuse the request and return that result to the model
# auto_fallback applies only when permission_mode is "auto":
#   "ask"   you decide when auto denies or cannot decide
#   "deny"  the denial goes back to the working model, which ends the turn
# --sandbox, --permission-mode, --auto-fallback, and --always-approve replace
# the matching configured value. A denial never ends the turn by itself.
permission_mode = "auto"
auto_fallback = "ask"

[permissions]
# Global config is user-trusted. readonly_paths and readwrite_paths add trees
# outside the workspace, on top of the built-in baseline. deny_paths,
# review_paths, and paths are rejected: the sandbox cannot withhold a
# subdirectory of an allowed path. Project-local config must not silently
# authorize host-wide access.
#
# Omitted network is on. A sandboxed action can request network, and that
# request still goes through permission_mode. network = false rejects the
# request before review, and approval cannot open it. This does not restrict
# Merry's model or MCP connections, and --sandbox off does not use this limit.
# network = true

# Optional host integrations. When the endpoint exists, ordinary sandboxed
# actions use the socket without another request. An integration that is not
# enabled here can still be requested for one action when its endpoint is visible.
#
# ssh_agent grants the agent socket and, when they exist, ~/.ssh/known_hosts
# and known_hosts2 read-only. It does not grant private keys, ~/.ssh/config, or
# network. gpg_agent grants the agent socket and existing pubring.kbx /
# pubring.gpg read-only, and sets GNUPGHOME. Private keys, trustdb, and gpg.conf
# stay off the list. A keyboxd database is reported instead of being granted.
# dbus is the session bus, including Secret Service.
# ssh_agent = true
# gpg_agent = true
# dbus = true

readonly_paths = [
  "/etc",
  "/var/log",
  "company-readonly",
]

readwrite_paths = [
  "company-work",
]

# Optional environment assignments for Merry-managed process actions. Values
# are injected after the inner action sandbox defaults, so they may override
# PATH, HOME, TMPDIR, or PWD. They do not change the outer bootstrap or provider
# environment. Extra filesystem access is the path lists above.
# environment = [
#   { name = "RUSTUP_TOOLCHAIN", value = "stable" },
# ]

# Optional user-trusted custom rules for AI permission review. Kept strictly in
# global config (never in project-local hidden directories) so repositories
# cannot weaken review policy or risk accidental commits.
# [permissions.review]
# environment = [
#   "Internal package registry: https://packages.example.test",
# ]
# allow = [
#   "Running local project verification scripts under scripts/dev/",
# ]
# soft_deny = [
#   "Modifying database migrations outside explicit migration tasks",
# ]
# hard_deny = [
#   "Running any command against production kubeconfig contexts",
# ]

[skills]
# Skill metadata is projected into the cacheable stable prefix. Full SKILL.md
# bodies remain on disk and are read through bounded read_text ranges only when used.
enabled = true
roots = [
  "skills",
]

[runtime.auto_compaction]
# Automatic compaction runs when the dynamic body reaches 85% of its budget.
# It first appends a summary directive to the unchanged session request,
# including its tools and history.
# Current input and retained turns remain visible but are excluded from the summary.
enabled = true
# Maximum recent completed turns to retain. Choose the largest complete suffix
# that fits the token budget: 5, 4, 3, 2, 1. Never split a turn or tool exchange.
# Prefer a smaller verbatim tail before archiving retained tool results.
# Manual compaction and compaction previews apply the same destination budget.
retained_model_turns = 5
# The compactor uses grok-build's full-replace summary prompt. Missing
# sections, extra prose, and unbalanced tags are cleaned and installed.
# Only an empty summary is retried. Covered history is also written to the
# session compaction/ directory when a session store is configured.
# Summary soft target: 5% of the primary window, clamped to 512-8192 tokens.
# Written into the prompt as guidance. It does not reject a usable summary.
# After compaction, the installed summary replaces covered turns and the retained
# raw tail stays verbatim. Raw history targets 10% of the primary window, capped at 32768 tokens;
# this is not half the body budget. The retained turn preference starts at 5
# complete turns and shrinks to 4, 3, 2, or 1 when that suffix exceeds the token
# budget. If even one raw turn exceeds the target, keep the minimum raw tail that
# fits the body budget rather than rejecting the step.
# The provider output allowance separately includes reasoning room.
# target_output_tokens sizes the compaction output budget. It does not reject the summary.
# target_output_tokens = 8192
# max_accepted_output_bytes = 65536
# Compaction does not inherit primary reasoning_effort; omission uses the provider default.
# reasoning_effort = "medium"
# When the full request cannot fit, rebuild once with only user/assistant history
# and this many newest covered tool exchanges. Reduce the count down to zero if
# necessary; roll over text only as a last resort. Exact artifacts remain on disk.
# one_shot_retained_tool_exchanges = 5
# one_shot_window_percent was removed: actual request fit replaces ratio thresholds.

[runtime.subagents]
# Disabled by default. Enable this to expose spawn_subagents, wait_subagents,
# and cancel_subagents to coding-loop runtimes.
enabled = false
max_threads = 6
max_depth = 1
# Default model-turn budget for a child task when spawn_subagents omits it.
max_model_turns = 2048

# User-configured MCP servers are trusted external tools. HTTP MCP endpoints
# are allowed to use the network because registering them in global config is
# an explicit user grant.
# Discovery failures warn and do not stop Merry (5 seconds per server, 10 seconds
# total). Session tool definitions are frozen, including across resume. Offline
# saved tools can reconnect on use after a short cooldown; calls are not replayed.
# New tools, changed definitions, or changed endpoints require a new session.
# Removing a server or narrowing its allowlist disables execution immediately on
# the next resume, without deleting its saved provider-visible definitions.
#
# [mcp.context7]
# url = "https://mcp.example.test/mcp"
# headers = { Authorization = "Bearer replace-with-your-token" }
# tools = ["resolve-library-id", "get-library-docs"]

[tui]
# Show up to five output lines for process commands and read_text calls.
# Timeline previews retain at most 180 Unicode characters per line; captured
# process output remains available in full through Alt+T (Option+T on macOS).
# Finished commands stay on one line until that row is opened. Set this to
# false to keep successful command output hidden even after opening. Failed
# commands show their output preview once opened; failed reads show diagnostics.
# An extra ... line indicates omitted output.
# Alt+T (Option+T on macOS) inspects captured process output independently of this setting. In the
# viewer, Left/Right selects a command, C copies its command, Y copies captured output,
# and Esc closes. Copy writes the system clipboard when the desktop provides
# one, so local tmux does not need set-clipboard. A terminal copy request is
# also sent for remote sessions.
show_successful_command_output = true
# Lines moved per coalesced mouse-wheel notch (1..=10). Keeps discrete wheels
# responsive without jumping 15-20 lines when terminals amplify scroll bursts.
mouse_scroll_lines = 3
# Enable smooth shimmer, vertical thinking rail wave, and brand pulse motion.
animations = true
# Comfortable maximum prose line width on wide terminals (40..=240, or 0 for full width).
# Code blocks and tables always use the full available timeline width.
max_reading_width = 104
# Optional Kitty OSC 66 text-sizing protocol for display titles: "off" (default), "auto", or "on".
text_sizing = "off"
# Primary Merry brand mark in the composer hairline and modal titles:
# "emoji" (default, 🎀) or "snowflake" (monochrome ❆ across Linux/macOS/iOS).
brand_mark = "emoji"

[tui.header]
# Ordered segments shown in the top bar. Supported values:
#   "workspace", "model", "context", "cache", "rate", "tokens"
items = ["workspace", "model", "context", "cache", "rate"]

[tui.theme]
# Every color slot accepts named ANSI colors ("light_magenta", "dark_gray", ...),
# "default"/"reset" to inherit the terminal color, or hex ("#RRGGBB" / "#RGB").
# Surfaces & backgrounds (omit to use Merry's built-in dark surface defaults):
background = "default"
surface = "#222228"
surface_subtle = "#1e1e23"
header_bg = "#361a3a"
status_bg = "default"
user_bg = "#2a2230"
code_bg = "#202026"
inline_code_bg = "#2a2a32"
selection_bg = "#36283e"
chip_bg = "default"
border = "#46444e"
border_focus = "light_magenta"
diff_add_bg = "#182b22"
diff_delete_bg = "#301920"
# Typography & semantic accents:
status = "light_magenta"
muted = "dark_gray"
text_secondary = "#a8a0b2"
focus = "light_magenta"
assistant = "white"
heading = "light_magenta"
link = "light_blue"
selection = "magenta"
tool_keyword = "light_cyan"
command = "light_blue"
diff_add = "light_green"
diff_delete = "light_red"
warning = "light_yellow"
error = "light_red"
risk = "magenta"
success = "light_green"

[tui.keymap]
# Composer editing stays on the readline keys and is not listed here:
# Ctrl+A/E jump to the line ends, Ctrl+B/F move by character, Ctrl+D deletes
# the character under the cursor, and Ctrl+U/K/W kill text.
# Up and Ctrl+P recall older input. Down and Ctrl+N move toward newer input.
# Setting history_previous or history_next replaces that arrow, and Ctrl+P or
# Ctrl+N stays when the key is still free.
# Ctrl+R searches history. While searching, type to narrow, Ctrl+R steps older,
# Ctrl+S steps newer, Enter keeps the line, and Esc cancels.
# Merry commands use Alt. On macOS that key is Option, and the on-screen
# prefix says Option. Config accepts alt+ and option+ as the same chord.
# Alt+X opens the command palette; that chord is fixed and is not a config key.
submit = "enter"
cancel_input_or_quit = "ctrl+c"
insert_newline = "ctrl+j"
paste_image = "ctrl+v"
toggle_plan = "alt+p"
interrupt = "esc"
quit = "ctrl+q"
scroll_up = "pageup"
scroll_down = "pagedown"
# Manual scrolling pauses following; return explicitly when ready for new output.
follow_latest = "ctrl+end"
# Toggle command output details; pressing the same shortcut again or Esc closes them.
open_command_details = "alt+t"
review_previous_user_input = "alt+u"
# Opens the local Web trajectory view when built with `--features web`.
open_session_in_browser = "alt+g"
history_previous = "up"
history_next = "down"
history_search = "ctrl+r"
# Quote timeline text and attach comments, then send them as one message.
# The same key is shown on the status chip. Select text, type a note, and
# Enter saves it. The quote stays highlighted; click that highlight to edit
# the note. Enter again, or the send chip, sends every saved comment.
# Esc drops the note you are typing, then leaves the mode. Saved comments
# stay until they are sent or cleared.
toggle_comment = "alt+c"

[observability.log]
# Enable this for smoke/debug runs that should write structured JSON logs.
enabled = false
level = "debug"
format = "json"
# Optional. If omitted, Merry writes to:
#   $XDG_STATE_HOME/merry/logs/merry.jsonl
# or:
#   ~/.local/state/merry/logs/merry.jsonl
# path = "~/.local/state/merry/logs/merry.jsonl"

[providers.default]
provider = "openai-compatible"
model = "gpt-4.1-mini"
# Optional. Sent as Responses API reasoning.effort when supported by the model.
# Leave unset to use provider/model defaults. The TUI presets include minimal,
# low, medium, high, xhigh, max, and ultra; custom provider-supported values
# are also accepted.
# reasoning_effort = "medium"
# Optional. Sent as the OpenAI `service_tier` request field (Responses and Chat
# Completions), and accepted for openai-compatible providers only. Supported
# values: ultrafast, auto, default, fast, flex, priority, scale. The ultrafast
# tier is Responses-only and requires protocol = "responses". Leave unset to
# omit the field.
# service_tier = "default"

[providers.retry]
# Provider-neutral retry policy for transient model setup or stream failures.
enabled = true
max_attempts = 6
initial_delay_ms = 1000
max_delay_ms = 120000
max_elapsed_ms = 300000
jitter = true

[models.context_compaction]
# Optional model override. Omit this table to use [providers.default] for
# checkpoint compaction. If provider is omitted, [providers.default].provider is
# reused.
model = "gpt-4.1-mini"

[models.approval_review]
# Optional model override for permission admission review. Omit this table to
# review with [providers.default].model.
#
# Merry owns the reviewer request shape: every review asks for a low reasoning
# effort and its own fixed output budget, independently of the primary
# provider's reasoning_effort. Point this role at a provider that accepts a
# reasoning effort, and prefer a small fast model over a deep-reasoning one.
model = "gpt-4.1-mini"

# [models.browser]
# Optional model override for browser verification subagents (`spawn_subagents`
# tasks whose `allowed_tools` use `browser_tab` / `browser_network` without
# `run_process` or `apply_patch`). Omit this table to run browser subagents on
# [providers.default] and preserve full KV-cache prefix sharing across tools.
# provider = "openai-compatible"
# model = "gpt-4.1-mini"

[providers.openai-compatible]
display_name = "OpenAI"
default_model = "gpt-4.1-mini"
type = "openai-compatible"
protocol = "responses"
base_url = "https://api.openai.com/v1"
# Optional provider-specific default used when this provider is selected in TUI.
# The value may be any provider-supported reasoning identifier.
# reasoning_effort = "medium"
# Optional provider-specific service tier (openai-compatible providers only).
# The ultrafast tier additionally requires protocol = "responses".
# service_tier = "default"
# Prefer api_key_file for local sandboxed smoke runs so the key stays in the
# mounted config directory instead of argv or process environment.
api_key_file = "secrets/openai.key"

# Anthropic Messages can be selected by changing
# [providers.default].provider to "anthropic" and using a Claude model.
#
# [providers.anthropic]
# display_name = "Anthropic"
# default_model = "claude-sonnet-4-5"
# type = "anthropic"
# reasoning_effort = "medium"
# base_url = "https://api.anthropic.com"
# api_version = "2023-06-01"
# default_max_output_tokens = 4096
# api_key_file = "secrets/anthropic.key"
