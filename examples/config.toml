# Copy this file to:
#   $XDG_CONFIG_HOME/merry/config.toml
# or, when XDG_CONFIG_HOME is unset:
#   ~/.config/merry/config.toml
#
# Usually required edits:
# - Set [providers.default].model for your provider.
# - Set [providers.openai-compatible].base_url for non-OpenAI-compatible hosts.
# - Set protocol = "chat_completions" for vendors that expose Chat Completions
#   instead of the OpenAI Responses API.
# - Set exactly one credential source in [providers.openai-compatible]:
#     api_key = "sk-..."
#   or:
#     api_key_file = "secrets/openai.key"
#
# Keep credentials out of this file when committing changes.
# Provider profiles created in the TUI are stored separately in
# $XDG_CONFIG_HOME/merry/managed/providers.toml. This tracked example remains
# the contract for user-authored config.toml.

[global]
profile = "default"

[cli]
# Default sandbox mode for every merry invocation, named after the root flag it
# stands in for:
#   "with-sandbox"   outer+inner bubblewrap (the built-in default for TUI and run)
#   "no-sandbox"     unrestricted host execution
#   "inner-sandbox"  inner action sandbox only, without the outer re-exec
# --with-sandbox, --no-sandbox, or --inner-sandbox on the command line replaces
# this default.
# sandbox = "inner-sandbox"
# Who reviews permission requests in every TUI and `merry run` session, like
# --approval-policy:
#   "none"              no approval needed: configured actions run unreviewed
#   "deny"              reject every permission request without asking
#   "model_only"        the [models.approval_review] model decides, no human
#                       fallback
#   "model_then_human"  the model decides; if it denies or cannot decide, you
#                       are asked in the TUI dialog or on the run prompt
#   "human_only"        you decide in the TUI dialog or on the run prompt
# --approval-policy on the command line replaces this default. sandbox and
# approval_policy are independent: the sandbox sets the execution boundary and
# the approval policy sets who reviews requests inside it, so any value here
# combines with any sandbox value, and a flag for one never changes the other.
# Path ceilings, deny_paths, and network = false still apply under every
# policy.
approval_policy = "model_then_human"

[permissions]
# Global config is user-trusted: readonly_paths/readwrite_paths define both the
# outer ceiling and inner preauthorization. review_paths adds per-action review
# to a declared subtree without raising its access ceiling. deny_paths always
# wins. Project-local config must not silently authorize host-wide access.
#
# Inner action network capability ceiling; defaults to true when omitted.
# true allows network requests, not network access: each action still requires
# its own approval. false rejects network requests before review or execution.
# This does not restrict model-provider or configured MCP network connections,
# and does not add network isolation to explicit --no-sandbox host execution.
network = true

# Optional host integrations. These are explicit outer-sandbox ceilings and
# inner preauthorizations: when the endpoint exists, ordinary inner actions use
# the socket and automatically imported client files without another request,
# like readonly_paths / readwrite_paths. review_paths still mask a configured
# endpoint until the exact path is approved for that action, and deny_paths
# always mask it. An integration that is not enabled here can still be requested
# per action when its endpoint is visible.
#
# Path policy decides reachability, not announcement: SSH_AUTH_SOCK,
# DBUS_SESSION_BUS_ADDRESS, and GNUPGHOME still name the configured endpoints,
# while a deny_paths or review_paths entry covering the socket, the keyring, or
# one of their parent directories masks the mount itself. A broad deny (for
# example a whole ~/.ssh or ~/.gnupg deny) therefore also hides the agent even
# though ssh_agent / gpg_agent / dbus is enabled: the client sees the endpoint
# and fails when it connects. Keep such denies narrow if the integration should
# stay usable; deny_paths is never reopened by an approval.
# dbus is the D-Bus session bus, including Secret Service/keyring access.
# ssh_agent = true
# gpg_agent = true
# dbus = true
# Once the SSH integration is available, inner actions get ~/.ssh/known_hosts
# and known_hosts2 read-only, not private keys or ~/.ssh/config. This does not
# enable networking, accept new host keys, or bypass deny_paths / review_paths.
# A blanket ~/.ssh deny still blocks these trust files; choose narrower deny
# paths if they should remain readable.
# ssh_agent also imports /etc/passwd and /etc/group for client account lookup,
# plus /etc/ssh/ssh_config and /etc/ssh/ssh_config.d, all read-only. No blanket
# /etc grant is needed. These imports obey deny_paths and do not import SSH
# server configuration, host private keys, or shadow password databases.
# Include targets outside the existing sandbox view still need readonly_paths.
# Explicitly authorized system SSH configuration remains visible when ssh_agent
# is disabled. Safe root-owned config files and static Includes use private
# read-only snapshots to retain OpenSSH ownership checks across user namespaces.
# Host files are never changed.
# gpg_agent enables the native GPG socket discovered with gpgconf --list-dirs,
# independently of ssh_agent (including GPG's SSH endpoint). When the
# integration is available, inner actions import pubring.kbx / pubring.gpg
# read-only; no extra readonly_paths is needed. Such inner actions use a private
# temporary GNUPGHOME view for locks and a fresh trustdb.
# Host private keys, configuration, and trust state are not imported. Public-key
# reads still obey deny_paths / review_paths. Keyboxd databases are not yet
# supported and produce an explicit error, not an implicit host write grant.
# Neither a readonly mount nor network isolation prevents Unix socket access.

readonly_paths = [
  "/etc",
  "/var/log",
  "company-readonly",
]

readwrite_paths = [
  "company-work",
]

# Each entry must exist and be within a declared readonly/readwrite grant.
# With readonly_paths = ["/abc"] and review_paths = ["/abc/d"], /abc/e stays
# readable but /abc/d is hidden until an exact path request is approved. The
# approval lasts for that action only, and cannot upgrade the read-only ceiling.
# For ~/.config, include it in readonly_paths and review_paths together.
review_paths = []

# Deny targets must exist; missing targets fail preflight without host mkdir.
# Create the target first or protect an existing ancestor instead.
deny_paths = [
  "~/.ssh",
]

# Optional environment assignments for Merry-managed process actions. Values
# are injected after the inner action sandbox defaults, so they may override
# PATH, HOME, TMPDIR, or PWD. They do not change the outer bootstrap or provider
# environment; filesystem access is still governed by the path rules above.
# environment = [
#   { name = "RUSTUP_TOOLCHAIN", value = "stable" },
# ]

[skills]
# Skill metadata is projected into the cacheable stable prefix. Full SKILL.md
# bodies remain on disk and are read through bounded read_text ranges only when used.
enabled = true
roots = [
  "skills",
]

[runtime.auto_compaction]
# Automatic compaction runs when dynamic context crosses the runtime hard
# watermark. Current user input is not included in the compaction input.
enabled = true
# Retain this many recent completed model turns verbatim. Aborted turns after
# the retained boundary stay verbatim without consuming this count.
retained_model_turns = 5
# By default the checkpoint output budget is 8% of the primary model window,
# clamped to 2048-32768 tokens. These optional fields override that calculation.
# target_output_tokens = 8192
# max_accepted_output_bytes = 65536
# Reasoning level for compaction model requests. Compaction never inherits the
# primary model's reasoning_effort: a request sized for hard coding turns can
# spend its whole output budget reasoning about history without writing the
# checkpoint. Omitted, the provider default applies.
# reasoning_effort = "medium"
# Body-to-window percentage above which compaction covers the whole history in one
# pass instead of rolling. 150 means a body of one and a half windows, which only
# happens after the context window shrinks below history the session already holds.
# A rolling reduction would need several passes there, and each pass re-summarizes
# the previous checkpoint, so the loss compounds. The one-shot pass shortens the
# older covered tool results to notices, which keeps their status, artifact id, and
# ref so the checkpoint can still cite them and read the body on demand. Set 0 to
# always roll.
# one_shot_window_percent = 150
# Covered tool exchanges the one-shot pass keeps at full length, newest first.
# one_shot_retained_tool_exchanges = 5

[runtime.subagents]
# Disabled by default. Enable this to expose spawn_subagents, wait_subagents,
# and cancel_subagents to coding-loop runtimes.
enabled = false
max_threads = 6
max_depth = 1
# Default model-turn budget for a child task when spawn_subagents omits it.
max_model_turns = 2048

# User-configured MCP servers are trusted external tools. HTTP MCP endpoints
# are allowed to use the network because registering them in global config is
# an explicit user grant.
# Discovery failures warn and do not stop Merry (5 seconds per server, 10 seconds
# total). Session tool definitions are frozen, including across resume. Offline
# saved tools can reconnect on use after a short cooldown; calls are not replayed.
# New tools, changed definitions, or changed endpoints require a new session.
# Removing a server or narrowing its allowlist disables execution immediately on
# the next resume, without deleting its saved provider-visible definitions.
#
# [mcp.context7]
# url = "https://mcp.example.test/mcp"
# headers = { Authorization = "Bearer replace-with-your-token" }
# tools = ["resolve-library-id", "get-library-docs"]

[tui]
# Show up to five output lines for successful commands. Failed commands always
# show their output preview; an extra ... line indicates omitted output.
# Ctrl+T inspects captured output independently of this default. In the viewer,
# Left/Right selects a command, C copies its command, Y copies captured output,
# and Esc closes. Copy uses OSC 52 and requires terminal clipboard support.
show_successful_command_output = false

[tui.theme]
# Semantic color names keep component styling configurable without changing
# rendering code.
status = "light_magenta"
muted = "dark_gray"
focus = "light_magenta"
assistant = "white"
selection = "magenta"
tool_keyword = "light_cyan"
command = "light_blue"
diff_add = "light_green"
diff_delete = "light_red"
warning = "light_yellow"
error = "light_red"
risk = "magenta"
success = "light_green"

[tui.keymap]
submit_next = "enter"
submit_backlog = "ctrl+b"
cancel_input_or_quit = "ctrl+c"
insert_newline = "ctrl+j"
paste_image = "ctrl+v"
toggle_plan = "ctrl+o"
interrupt = "esc"
quit = "ctrl+q"
scroll_up = "pageup"
scroll_down = "pagedown"
# Manual scrolling pauses following; return explicitly when ready for new output.
follow_latest = "ctrl+end"
# Toggle command output details; pressing the same shortcut again or Esc closes them.
open_command_details = "ctrl+t"
review_previous_user_input = "ctrl+u"
open_session_in_browser = "ctrl+g"
history_previous = "up"
history_next = "down"
resume_suspended = "ctrl+n"
discard_suspended = "ctrl+d"

[observability.log]
# Enable this for smoke/debug runs that should write structured JSON logs.
enabled = false
level = "debug"
format = "json"
# Optional. If omitted, Merry writes to:
#   $XDG_STATE_HOME/merry/logs/merry.jsonl
# or:
#   ~/.local/state/merry/logs/merry.jsonl
# path = "~/.local/state/merry/logs/merry.jsonl"

[providers.default]
provider = "openai-compatible"
model = "gpt-4.1-mini"
# Optional. Sent as Responses API reasoning.effort when supported by the model.
# Leave unset to use provider/model defaults. The TUI presets include minimal,
# low, medium, high, xhigh, max, and ultra; custom provider-supported values
# are also accepted.
# reasoning_effort = "medium"
# Optional. Sent as the OpenAI `service_tier` request field (Responses and Chat
# Completions), and accepted for openai-compatible providers only. Supported
# values: ultrafast, auto, default, fast, flex, priority, scale. The ultrafast
# tier is Responses-only and requires protocol = "responses". Leave unset to
# omit the field.
# service_tier = "default"

[providers.retry]
# Provider-neutral retry policy for transient model setup or stream failures.
enabled = true
max_attempts = 6
initial_delay_ms = 1000
max_delay_ms = 120000
max_elapsed_ms = 300000
jitter = true

[models.context_compaction]
# Optional model override. Omit this table to use [providers.default] for
# checkpoint compaction. If provider is omitted, [providers.default].provider is
# reused.
model = "gpt-4.1-mini"

[models.approval_review]
# Optional model override for permission admission review. Omit this table to
# review with [providers.default].model.
#
# Merry owns the reviewer request shape: every review asks for a low reasoning
# effort and its own fixed output budget, independently of the primary
# provider's reasoning_effort. Point this role at a provider that accepts a
# reasoning effort, and prefer a small fast model over a deep-reasoning one.
model = "gpt-4.1-mini"

[providers.openai-compatible]
display_name = "OpenAI"
default_model = "gpt-4.1-mini"
type = "openai-compatible"
protocol = "responses"
base_url = "https://api.openai.com/v1"
# Optional provider-specific default used when this provider is selected in TUI.
# The value may be any provider-supported reasoning identifier.
# reasoning_effort = "medium"
# Optional provider-specific service tier (openai-compatible providers only).
# The ultrafast tier additionally requires protocol = "responses".
# service_tier = "default"
# Prefer api_key_file for local sandboxed smoke runs so the key stays in the
# mounted config directory instead of argv or process environment.
api_key_file = "secrets/openai.key"

# Anthropic Messages can be selected by changing
# [providers.default].provider to "anthropic" and using a Claude model.
#
# [providers.anthropic]
# display_name = "Anthropic"
# default_model = "claude-sonnet-4-5"
# type = "anthropic"
# reasoning_effort = "medium"
# base_url = "https://api.anthropic.com"
# api_version = "2023-06-01"
# default_max_output_tokens = 4096
# api_key_file = "secrets/anthropic.key"
