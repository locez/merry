# Copy this file to:
#   $XDG_CONFIG_HOME/merry/config.toml
# or, when XDG_CONFIG_HOME is unset:
#   ~/.config/merry/config.toml
#
# Usually required edits:
# - Set [providers.default].model for your provider.
# - Set [providers.openai-compatible].base_url for non-OpenAI-compatible hosts.
# - Set exactly one credential source in [providers.openai-compatible]:
#     api_key = "sk-..."
#   or:
#     api_key_file = "secrets/openai.key"
#
# Keep credentials out of this file when committing changes.

[global]
profile = "default"

[observability.log]
# Enable this for smoke/debug runs that should write structured JSON logs.
enabled = true
level = "debug"
format = "json"
# Optional. If omitted, Merry writes to:
#   $XDG_STATE_HOME/merry/logs/merry.jsonl
# or:
#   ~/.local/state/merry/logs/merry.jsonl
# path = "~/.local/state/merry/logs/merry.jsonl"

[providers.default]
provider = "openai-compatible"
model = "gpt-4.1-mini"

[providers.openai-compatible]
base_url = "https://api.openai.com/v1"
# Prefer api_key_file for local sandboxed smoke runs so the key stays in the
# mounted config directory instead of argv or process environment.
api_key_file = "secrets/openai.key"
