[workspace]
resolver = "3"
members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-provider-openai",
    "crates/merry-cli",
]
default-members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-provider-openai",
    "crates/merry-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
