[workspace]
resolver = "3"
members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-tool-workspace",
    "crates/merry-provider-openai",
    "crates/merry",
    "crates/merry-cli",
    "crates/merry-py",
]
default-members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-tool-workspace",
    "crates/merry-provider-openai",
    "crates/merry",
    "crates/merry-cli",
    "crates/merry-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
jsonschema = { version = "0.30", default-features = false }
libc = "0.2"
pyo3 = { version = "0.28.3", features = ["extension-module"] }
ratatui = "0.30"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "macros", "io-util", "fs", "process", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tempfile = "3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
