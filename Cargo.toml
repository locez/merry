[workspace]
resolver = "3"
members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-tool-workspace",
    "crates/merry-mcp",
    "crates/merry-provider-openai",
    "crates/merry-provider-anthropic",
    "crates/merry",
    "crates/merry-cli",
    "crates/merry-py",
]
default-members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-tool-workspace",
    "crates/merry-mcp",
    "crates/merry-provider-openai",
    "crates/merry-provider-anthropic",
    "crates/merry",
    "crates/merry-cli",
    "crates/merry-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
jsonschema = { version = "0.30", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
pyo3 = { version = "0.28.3", features = ["extension-module"] }
pulldown-cmark = "0.13"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
syntect = "5"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "macros", "io-util", "fs", "process", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tempfile = "3"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
