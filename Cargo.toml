[workspace]
resolver = "3"
members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-process",
    "crates/merry-tools",
    "crates/merry-tools-macros",
    "crates/merry-coding",
    "crates/merry-mcp",
    "crates/merry-provider-openai",
    "crates/merry-provider-anthropic",
    "crates/merry",
    "crates/merry-cli",
    "crates/merry-web",
    "crates/merry-py",
]
default-members = [
    "crates/merry-core",
    "crates/merry-llm",
    "crates/merry-runtime",
    "crates/merry-process",
    "crates/merry-tools",
    "crates/merry-tools-macros",
    "crates/merry-coding",
    "crates/merry-mcp",
    "crates/merry-provider-openai",
    "crates/merry-provider-anthropic",
    "crates/merry",
    "crates/merry-cli",
    "crates/merry-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
axum = "0.8"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-core = "0.3"
futures-executor = "0.3"
futures-util = "0.3"
hayro = "0.9"
jsonschema = { version = "0.62", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pyo3-build-config = "0.29.0"
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pulldown-cmark = "0.13"
quick-xml = "0.42"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { version = "1", features = ["fs", "process"] }
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
syn = { version = "2", features = ["full"] }
schemars = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.11"
syntect = "5"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "macros", "io-util", "fs", "process", "time"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tempfile = "3"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
# `deny` so one reviewed call can use `allow`. Tokio 1.54 deprecated the safe
# `AsyncFd::with_interest` wrapper; the replacement is unsafe, and
# `ReviewTerminal::open` is the only allowed site.
unsafe_code = "deny"
