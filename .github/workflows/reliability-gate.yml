name: Deterministic Reliability Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust reliability and security
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download tested Web assets
        uses: actions/download-artifact@v8
        with:
          name: merry-web-dist
          path: web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify scenario selection fails closed
        run: bash .github/scripts/tests/cargo-test-scenario.sh

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "reliability-gate-linux"

      - name: Install shell and sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fish ripgrep gnupg openssh-client

      - name: Run deterministic Rust suite
        run: |
          cargo build --locked -p merry-process --bin merry-sandbox-helper
          cargo test --locked --workspace --features merry-cli/web

      - name: Verify required reliability and security scenarios
        run: |
          set -euo pipefail
          listing=$(cargo test --locked --workspace --features merry-cli/web -- --list)
          for scenario in \
            t6_failure_links_journal_output_and_trajectory \
            provider_stream_eof_before_completed_emits_failed \
            provider_stream_error_emits_failed_without_step_completed \
            duplicate_tool_result_after_resolved_does_not_mutate_session \
            provider_cancel_keeps_tool_exchange_for_retry \
            cancelling_ \
            agent_loop_process_command_invalid_arguments \
            provider_request_trace_includes_checkpoint_budget_diagnostics \
            denied_apply_patch \
            registered_read_file_domain_failure \
            permissioned_factory_preauthorizes_configured_host_integrations \
            settings_debug_does_not_include_secret_material \
            product_private_paths_are_not_inherited_as_task_grants
          do
            if ! grep -Eq "${scenario}.*: test$" <<< "$listing"; then
              printf 'Required scenario missing from workspace test suite: %s\n' "$scenario" >&2
              exit 1
            fi
          done

      - name: Run Rust lint gate
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Summarize deterministic diagnostics
        if: always()
        run: |
          {
            echo "## Deterministic reliability/security gate"
            echo "- revision: \`${GITHUB_SHA}\`"
            echo "- named evidence scenario: \`t6_failure_links_journal_output_and_trajectory\`"
            echo "- live provider: not used"
            echo "- runtime event, artifact, ledger, trajectory, and test-result links are asserted by the named scenario"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-windows:
    name: Rust Windows compatibility
    needs: web
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download tested Web assets
        uses: actions/download-artifact@v8
        with:
          name: merry-web-dist
          path: web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "reliability-gate-windows"

      - name: Run Windows cross-platform unit tests
        run: cargo test --locked --workspace --exclude merry-py --features merry-cli/web --lib --bins

      - name: Run Windows lint gate
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  web:
    name: Web trajectory contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test Web assets
        working-directory: web
        run: npm ci && npm test

      - name: Verify generated Web sources
        run: git diff --exit-code -- web/src/trajectory-contract.generated.ts

      - name: Upload tested Web assets
        uses: actions/upload-artifact@v7
        with:
          name: merry-web-dist
          path: web/dist
          if-no-files-found: error
