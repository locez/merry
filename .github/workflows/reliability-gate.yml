name: Deterministic Reliability Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust reliability and security
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download tested Web assets
        uses: actions/download-artifact@v4
        with:
          name: merry-web-dist
          path: web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install shell and sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap fish ripgrep gnupg openssh-client

      - name: Enable unprivileged sandbox namespaces
        run: |
          set -euo pipefail
          # Ubuntu 26 ships /etc/apparmor.d/bwrap-userns-restrict with the
          # apparmor package. One bwrap still starts, but children are stacked
          # into unpriv_bwrap, so the inner action sandbox cannot create its
          # user namespace. The local override is the host fix in SANDBOX.md.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          profile=/etc/apparmor.d/bwrap-userns-restrict
          if [[ -f "$profile" ]]; then
            sudo mkdir -p /etc/apparmor.d/local
            sudo tee /etc/apparmor.d/local/bwrap-userns-restrict /etc/apparmor.d/local/unpriv_bwrap >/dev/null <<'RULE'
          # Allow bubblewrap inside bubblewrap: when a sandboxed process executes bwrap,
          # attach the full bwrap profile again instead of the capability-stripped stack.
          priority=1 allow px /usr/bin/bwrap -> bwrap,
          RULE
            if ! sudo apparmor_parser -r "$profile"; then
              # AppArmor before 4.1 rejects rule priority. Unload the profile
              # only after the sysctl is off; unloading it alone breaks even
              # a single bubblewrap layer.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              sudo apparmor_parser -R "$profile"
            fi
          fi
          bwrap --unshare-user --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true
          bwrap --unshare-user --die-with-parent --ro-bind / / --proc /proc --dev /dev -- \
            bwrap --unshare-user --die-with-parent --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Verify scenario selection fails closed
        run: bash .github/scripts/tests/cargo-test-scenario.sh

      - name: Run named T6 evidence scenario
        run: >-
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test provider_boundary
          t6_failure_evidence

      - name: Run deterministic security and lifecycle scenarios
        run: |
          set -euo pipefail
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test provider_boundary provider_stream_eof_before_completed_emits_failed
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test provider_boundary provider_stream_error_emits_failed_without_step_completed
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test provider_boundary duplicate_tool_result_after_resolved_does_not_mutate_session
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test provider_boundary provider_cancel_keeps_tool_exchange_for_retry
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test cancellation cancelling_
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test agent_loop agent_loop_process_command_invalid_arguments
          bash .github/scripts/cargo-test-scenario.sh -p merry-runtime --test agent_loop provider_request_trace_includes_checkpoint_budget_diagnostics
          bash .github/scripts/cargo-test-scenario.sh -p merry-tools --test runtime_integration denied_apply_patch
          bash .github/scripts/cargo-test-scenario.sh -p merry-tools --test runtime_integration registered_read_text_domain_failure
          bash .github/scripts/cargo-test-scenario.sh -p merry-process --lib bwrap_process_plan_hides_unapproved_host_integrations
          bash .github/scripts/cargo-test-scenario.sh -p merry-cli --bin merry settings_debug_does_not_include_secret_material
          bash .github/scripts/cargo-test-scenario.sh -p merry-cli --bin merry sandbox_supports_symlinked_product_write_roots

      - name: Run deterministic Rust suite
        run: |
          cargo test --locked --all
          cargo test --locked -p merry-cli --features web

      - name: Run Rust lint gate
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Summarize deterministic diagnostics
        if: always()
        run: |
          {
            echo "## Deterministic reliability/security gate"
            echo "- revision: \`${GITHUB_SHA}\`"
            echo "- named evidence scenario: \`t6_failure_evidence\`"
            echo "- live provider: not used"
            echo "- runtime event, artifact, ledger, trajectory, and test-result links are asserted by the named scenario"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-windows:
    name: Rust Windows compatibility
    needs: web
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download tested Web assets
        uses: actions/download-artifact@v4
        with:
          name: merry-web-dist
          path: web/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Windows cross-platform unit tests
        run: |
          cargo test --locked -p merry-core -p merry-llm -p merry-provider-openai -p merry-provider-anthropic -p merry-mcp -p merry-tools-macros
          cargo test --locked -p merry-runtime --lib
          cargo test --locked -p merry-process --lib
          cargo test --locked -p merry-tools --lib
          cargo test --locked -p merry-coding --lib
          cargo test --locked -p merry-cli --bin merry

      - name: Run Windows lint gate
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  web:
    name: Web trajectory contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test Web assets
        working-directory: web
        run: npm ci && npm test

      - name: Verify generated Web sources
        run: git diff --exit-code -- web/src/trajectory-contract.generated.ts

      - name: Upload tested Web assets
        uses: actions/upload-artifact@v4
        with:
          name: merry-web-dist
          path: web/dist
          if-no-files-found: error
