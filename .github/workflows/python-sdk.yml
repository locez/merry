name: Python SDK

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock

      - name: Install Python dependencies
        working-directory: sdks/python
        run: uv sync --locked --no-install-project --python "3.14"

      - name: Check Python formatting and lint
        working-directory: sdks/python
        run: |
          uv run --no-sync --with ruff ruff format --check .
          uv run --no-sync --with ruff ruff check .

      - name: Check Python types
        working-directory: sdks/python
        run: uv run --no-sync --with ty ty check

      - name: Compile examples and probes
        working-directory: sdks/python
        run: uv run --no-sync python -m compileall -q examples probes

  python-sdk:
    name: Python SDK checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "python-sdk-${{ matrix.python-version }}"

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock

      - name: Install Python dependencies
        working-directory: sdks/python
        run: uv sync --locked --no-install-project --python "${{ matrix.python-version }}"

      - name: Build deterministic test extension
        working-directory: sdks/python
        run: uv run --no-sync --with maturin maturin develop --uv --features test-utils

      - name: Run Python tests
        working-directory: sdks/python
        run: uv run --no-sync --with pytest python -m pytest tests -q

      - name: Build default-feature wheel and source archive
        working-directory: sdks/python
        run: uv build
