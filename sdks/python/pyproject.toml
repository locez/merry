[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "merry-agent"
dynamic = ["version"]
readme = "README.md"
description = "Python bindings for the Merry agent runtime"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/locez/merry"
Repository = "https://github.com/locez/merry"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.maturin]
manifest-path = "../../crates/merry-py/Cargo.toml"
python-source = "."
python-packages = ["merry"]
module-name = "merry._merry"
bindings = "pyo3"
exclude = [
    "**/__pycache__/*",
    "**/*.py[cod]",
    "examples/**",
    "probes/**",
    "tests/**",
]
