[package]
name = "merry-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_merry"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-executor.workspace = true
futures-core.workspace = true
futures-util.workspace = true
merry-core = { path = "../merry-core", version = "0.1.0" }
merry-llm = { path = "../merry-llm", version = "0.1.0", features = ["test-utils"] }
merry = { path = "../merry", version = "0.1.0", features = ["openai-compatible", "anthropic"] }
merry-runtime = { path = "../merry-runtime", version = "0.1.0" }
pyo3.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-util.workspace = true

[lints]
workspace = true
