[package]
name = "merry-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_merry"
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-utils = ["dep:futures-util", "dep:merry-llm", "merry-llm/test-utils"]

[dependencies]
merry-core = { path = "../merry-core", version = "0.1.0" }
merry = { path = "../merry", version = "0.1.0", features = ["openai-compatible", "anthropic"] }
futures-util = { workspace = true, optional = true }
merry-llm = { path = "../merry-llm", version = "0.1.0", optional = true }
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true

[lints]
workspace = true
