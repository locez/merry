[package]
name = "merry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap.workspace = true
crossterm.workspace = true
futures-util.workspace = true
merry-core = { path = "../merry-core", version = "0.1.0" }
merry-llm = { path = "../merry-llm", version = "0.1.0" }
merry-mcp = { path = "../merry-mcp", version = "0.1.0" }
merry = { path = "../merry", version = "0.1.0" }
merry-process = { path = "../merry-process", version = "0.1.0" }
merry-provider-anthropic = { path = "../merry-provider-anthropic", version = "0.1.0" }
merry-provider-openai = { path = "../merry-provider-openai", version = "0.1.0" }
merry-runtime = { path = "../merry-runtime", version = "0.1.0" }
merry-tool-workspace = { path = "../merry-tool-workspace", version = "0.1.0" }
pulldown-cmark.workspace = true
# Paragraph::line_count keeps wrapped timeline viewport offsets exact.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syntect.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
two-face.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard.workspace = true
image.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "merry"
path = "src/main.rs"

[lints]
workspace = true
