[package]
name = "merry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "A lightweight terminal coding agent (CLI & interactive TUI) powered by a unified Rust runtime."

[features]
web = ["dep:merry-web"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
crossterm = { workspace = true, features = ["osc52"] }
futures-util.workspace = true
merry-core = { path = "../merry-core", version = "0.1.0" }
merry-llm = { path = "../merry-llm", version = "0.1.0" }
merry-mcp = { path = "../merry-mcp", version = "0.1.0" }
merry = { path = "../merry", version = "0.1.0", features = ["openai-compatible", "anthropic"] }
merry-process = { path = "../merry-process", version = "0.1.0" }
merry-provider-anthropic = { path = "../merry-provider-anthropic", version = "0.1.0" }
merry-provider-openai = { path = "../merry-provider-openai", version = "0.1.0" }
merry-runtime = { path = "../merry-runtime", version = "0.1.0" }
merry-tools = { path = "../merry-tools", version = "0.1.0" }
merry-web = { path = "../merry-web", version = "0.1.0", optional = true }
pulldown-cmark.workspace = true
# Paragraph::line_count keeps wrapped timeline viewport offsets exact.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syntect.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
two-face.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
arboard.workspace = true
image.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["pty"] }

[[bin]]
name = "merry"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/merry-v{ version }-{ target }.{ archive-format }"
bin-dir = "merry-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true
